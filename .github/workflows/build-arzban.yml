name: Build Arzban 1.4.0 Release Candidate

on:
  push:
    branches:
      - arzban-v1.4-telegram-source
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Lint release
        run: gradle --no-daemon :app:lintRelease

      - name: Live DO_L4 parser test
        run: gradle --no-daemon :app:testReleaseUnitTest

      - name: Build unsigned release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Prepare unsigned artifacts
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk Arzban-1.4.0-unsigned.apk
          cp app/build/outputs/bundle/release/app-release.aab Arzban-1.4.0-unsigned.aab

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: Arzban-1.4.0-UNSIGNED
          path: |
            Arzban-1.4.0-unsigned.apk
            Arzban-1.4.0-unsigned.aab
          if-no-files-found: error
