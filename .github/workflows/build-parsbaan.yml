name: Build Parsbaan APK

on:
  push:
    branches:
      - parsbaan-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Parsbaan source
        shell: bash
        run: |
          mkdir -p /tmp/parsbaan
          cat parsbaan-build/source-00.b64 parsbaan-build/source-01.b64 parsbaan-build/source-02.b64 parsbaan-build/source-03.b64 > /tmp/parsbaan.b64
          base64 -d /tmp/parsbaan.b64 > /tmp/parsbaan.tgz
          echo "3e8cf780409cde889d81a5f4f85b937d4b76f3a5fc6dd452347504291a05a36e  /tmp/parsbaan.tgz" | sha256sum -c -
          tar -xzf /tmp/parsbaan.tgz -C /tmp/parsbaan

      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: /tmp/parsbaan
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s /tmp/parsbaan/app/build/outputs/apk/debug/app-debug.apk
          cp /tmp/parsbaan/app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Parsbaan-MVP-0.1.apk"
          sha256sum "$GITHUB_WORKSPACE/Parsbaan-MVP-0.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Parsbaan-MVP-0.1-APK
          path: Parsbaan-MVP-0.1.apk
          if-no-files-found: error
